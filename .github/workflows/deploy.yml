name: Deploy to GitHub Pages

on:
  push:
    branches:
      - deploy-github-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout moly repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
          targets: wasm32-unknown-unknown

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Install wasm-bindgen-cli
        run: |
          cargo install wasm-bindgen-cli --version 0.2.100 --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Checkout makepad repository
        uses: actions/checkout@v4
        with:
          repository: wyenox/makepad
          ref: cargo-makepad-wasm-fix
          path: makepad

      - name: Install cargo-makepad
        run: |
          cargo install --path makepad/tools/cargo_makepad

      - name: Build WASM app
        run: |
          cargo makepad wasm --bindgen build -p moly --release

      - name: Verify and Fix Missing Resources
        run: |
          # Check if critical files exist
          if [ ! -f target/makepad-wasm-app/release/moly/makepad_platform/web_gl.js ]; then
            echo "WARNING: makepad_platform/web_gl.js missing. Attempting manual copy..."
            
            # Locate source directories in the checked out makepad repo
            # We search for key files to identify the directories
            
            # Platform files
            PLATFORM_SRC=$(find makepad -name web_gl.js -type f | head -n 1)
            if [ -n "$PLATFORM_SRC" ]; then
              PLATFORM_DIR=$(dirname "$PLATFORM_SRC")
              echo "Found platform source at $PLATFORM_DIR"
              mkdir -p target/makepad-wasm-app/release/moly/makepad_platform
              cp -v "$PLATFORM_DIR"/*.js target/makepad-wasm-app/release/moly/makepad_platform/ || true
              cp -v "$PLATFORM_DIR"/*.css target/makepad-wasm-app/release/moly/makepad_platform/ || true
            else
              echo "ERROR: Could not find web_gl.js in makepad checkout"
            fi
            
            # Wasm bridge files
            BRIDGE_SRC=$(find makepad -name wasm_bridge.js -type f | head -n 1)
            if [ -n "$BRIDGE_SRC" ]; then
              BRIDGE_DIR=$(dirname "$BRIDGE_SRC")
              echo "Found bridge source at $BRIDGE_DIR"
              mkdir -p target/makepad-wasm-app/release/moly/makepad_wasm_bridge
              cp -v "$BRIDGE_DIR"/*.js target/makepad-wasm-app/release/moly/makepad_wasm_bridge/ || true
            else
              echo "ERROR: Could not find wasm_bridge.js in makepad checkout"
            fi
          else
            echo "Resources appear to be present."
          fi

      - name: Add .nojekyll for GitHub Pages
        run: |
          touch target/makepad-wasm-app/release/moly/.nojekyll

      - name: List build output
        run: |
          echo "=== Contents of target/makepad-wasm-app/release/moly ==="
          ls -laR target/makepad-wasm-app/release/moly/ | head -100

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "target/makepad-wasm-app/release/moly"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
