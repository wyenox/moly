name: Deploy to GitHub Pages

on:
  push:
    branches:
      - deploy-github-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout moly repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
          targets: wasm32-unknown-unknown

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Install wasm-bindgen-cli
        run: |
          cargo install wasm-bindgen-cli --version 0.2.100 --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Checkout makepad repository
        uses: actions/checkout@v4
        with:
          repository: wyenox/makepad
          ref: cargo-makepad-wasm-fix
          path: makepad

      - name: Install cargo-makepad
        run: |
          cargo install --path makepad/tools/cargo_makepad

      - name: Build WASM app
        run: |
          cargo makepad wasm --bindgen build -p moly --release

      - name: Add .nojekyll for GitHub Pages
        run: |
          touch target/makepad-wasm-app/release/moly/.nojekyll

      - name: List build output
        run: |
          echo "=== Contents of target/makepad-wasm-app/release/moly ==="
          ls -laR target/makepad-wasm-app/release/moly/ | head -100

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "target/makepad-wasm-app/release/moly"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
