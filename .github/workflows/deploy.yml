name: Deploy to GitHub Pages

on:
  push:
    branches:
      - deploy-github-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout moly repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
          targets: wasm32-unknown-unknown

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Install wasm-bindgen-cli
        run: |
          cargo install wasm-bindgen-cli --version 0.2.100 --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Checkout makepad repository
        uses: actions/checkout@v4
        with:
          repository: wyenox/makepad
          ref: cargo-makepad-wasm-fix
          path: makepad

      - name: Install cargo-makepad
        run: |
          cargo install --path makepad/tools/cargo_makepad

      - name: Build WASM app
        run: |
          cargo makepad wasm --bindgen build -p moly --release

      - name: Verify and Fix Missing Resources
        run: |
          # Check if critical files exist
          if [ ! -f target/makepad-wasm-app/release/moly/makepad_platform/web_gl.js ]; then
            echo "WARNING: makepad_platform/web_gl.js missing. Attempting manual copy..."
            
            # Locate source directories in the checked out makepad repo
            # We search for key files to identify the directories
            
            # Platform files
            # Exclude platform2 as it is unstable
            PLATFORM_SRC=$(find makepad -name web_gl.js -not -path "*/platform2/*" -type f | head -n 1)
            if [ -n "$PLATFORM_SRC" ]; then
              PLATFORM_DIR=$(dirname "$PLATFORM_SRC")
              echo "Found platform source at $PLATFORM_DIR"
              mkdir -p target/makepad-wasm-app/release/moly/makepad_platform
              cp -v "$PLATFORM_DIR"/*.js target/makepad-wasm-app/release/moly/makepad_platform/ || true
              cp -v "$PLATFORM_DIR"/*.css target/makepad-wasm-app/release/moly/makepad_platform/ || true
            else
              echo "ERROR: Could not find web_gl.js in makepad checkout"
            fi
            
            # Wasm bridge files
            BRIDGE_SRC=$(find makepad -name wasm_bridge.js -type f | head -n 1)
            if [ -n "$BRIDGE_SRC" ]; then
              BRIDGE_DIR=$(dirname "$BRIDGE_SRC")
              echo "Found bridge source at $BRIDGE_DIR"
              mkdir -p target/makepad-wasm-app/release/moly/makepad_wasm_bridge
              cp -v "$BRIDGE_DIR"/*.js target/makepad-wasm-app/release/moly/makepad_wasm_bridge/ || true
            else
              echo "ERROR: Could not find wasm_bridge.js in makepad checkout"
            fi

            # Moly-kit resources
            if [ -d "moly-kit/resources" ]; then
              echo "Copying moly-kit resources..."
              mkdir -p target/makepad-wasm-app/release/moly/moly_kit/resources
              cp -r moly-kit/resources/* target/makepad-wasm-app/release/moly/moly_kit/resources/
            else
               echo "WARNING: moly-kit/resources not found"
            fi

            # Makepad Widgets resources
            WIDGETS_RES=$(find makepad -path "*/widgets/resources" -type d | head -n 1)
            if [ -n "$WIDGETS_RES" ]; then
               echo "Copying makepad-widgets resources from $WIDGETS_RES..."
               mkdir -p target/makepad-wasm-app/release/moly/makepad_widgets/resources
               cp -r "$WIDGETS_RES"/* target/makepad-wasm-app/release/moly/makepad_widgets/resources/
            fi

            # Fonts (Emoji)
            EMOJI_FONT=$(find makepad -name NotoColorEmoji.ttf -type f | head -n 1)
            if [ -n "$EMOJI_FONT" ]; then
               EMOJI_DIR=$(dirname "$EMOJI_FONT")
               echo "Copying emoji font from $EMOJI_DIR..."
               mkdir -p target/makepad-wasm-app/release/moly/makepad_fonts_emoji/resources
               cp "$EMOJI_FONT" target/makepad-wasm-app/release/moly/makepad_fonts_emoji/resources/
            fi

            # Fonts (Chinese) - Find one and assume structure or find all
            # We need to handle multiple chinese fonts: bold, regular, etc.
            # They seem to be in separate crates/folders in target, but might be in one place in source.
            
            # LXGWWenKaiBold.ttf -> makepad_fonts_chinese_bold
            CN_BOLD=$(find makepad -name LXGWWenKaiBold.ttf -type f | head -n 1)
            if [ -n "$CN_BOLD" ]; then
               echo "Copying Chinese Bold font..."
               mkdir -p target/makepad-wasm-app/release/moly/makepad_fonts_chinese_bold/resources
               cp "$CN_BOLD" target/makepad-wasm-app/release/moly/makepad_fonts_chinese_bold/resources/
            fi

            # LXGWWenKaiRegular.ttf -> makepad_fonts_chinese_regular
            CN_REG=$(find makepad -name LXGWWenKaiRegular.ttf -type f | head -n 1)
            if [ -n "$CN_REG" ]; then
               echo "Copying Chinese Regular font..."
               mkdir -p target/makepad-wasm-app/release/moly/makepad_fonts_chinese_regular/resources
               cp "$CN_REG" target/makepad-wasm-app/release/moly/makepad_fonts_chinese_regular/resources/
            fi

          else
            echo "Resources appear to be present."
          fi

      - name: Setup COI Service Worker
        run: |
          echo "Downloading coi-serviceworker..."
          curl -o target/makepad-wasm-app/release/moly/coi-serviceworker.min.js https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js

          echo "Injecting script into index.html..."
          sed -i 's|<head>|<head>\n    <script src="coi-serviceworker.min.js"></script>|' target/makepad-wasm-app/release/moly/index.html

      - name: Add .nojekyll for GitHub Pages
        run: |
          touch target/makepad-wasm-app/release/moly/.nojekyll

      - name: List build output
        run: |
          echo "=== Contents of target/makepad-wasm-app/release/moly ==="
          ls -laR target/makepad-wasm-app/release/moly/ | head -100

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "target/makepad-wasm-app/release/moly"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
